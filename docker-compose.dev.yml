version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: distrinov
      POSTGRES_PASSWORD: distrinov_dev
      POSTGRES_DB: distrinov
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U distrinov"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - distrinov

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://distrinov:distrinov_dev@db:5432/distrinov
      NODE_ENV: development
      PORT: 3000
      CORS_ORIGIN: "*"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - distrinov

volumes:
  postgres_data:

networks:
  distrinov:
    driver: bridge
