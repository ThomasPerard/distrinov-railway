<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Distrinov — Étude de Cas Recrutement</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
    }
    .container {
      background: white;
      padding: 3rem;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      text-align: center;
      max-width: 600px;
    }
    h1 {
      color: #667eea;
      margin-bottom: 1rem;
      font-size: 2.5rem;
    }
    p {
      color: #666;
      line-height: 1.8;
      margin-bottom: 2rem;
    }
    .status {
      background: #f0f4ff;
      border-left: 4px solid #667eea;
      padding: 1rem;
      margin-bottom: 2rem;
      text-align: left;
      border-radius: 4px;
    }
    .status strong { color: #667eea; }
    .endpoint {
      background: #f5f5f5;
      padding: 1rem;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      margin: 0.5rem 0;
      font-size: 0.9rem;
      color: #333;
    }
    button {
      background: #667eea;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.3s;
      margin-top: 1rem;
    }
    button:hover { background: #764ba2; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎯 Distrinov</h1>
    <p><strong>Plateforme interactive d'étude de cas recrutement</strong></p>

    <div class="status">
      <strong>État :</strong> Serveur Express + PostgreSQL actif
      <div style="margin-top: 0.5rem; font-size: 0.9rem;">
        🗄️ Base de données connectée<br>
        📡 WebSocket en ligne<br>
        ✅ Prêt pour Railway
      </div>
    </div>

    <p>Endpoints disponibles :</p>
    <div class="endpoint">GET /api/state</div>
    <div class="endpoint">POST /api/state</div>
    <div class="endpoint">GET /api/content/:contentId</div>
    <div class="endpoint">POST /api/evals/:evalId</div>

    <button onclick="checkHealth()">Vérifier la santé</button>
  </div>

  <script>
    async function checkHealth() {
      try {
        const res = await fetch('/health');
        const data = await res.json();
        alert('✅ Serveur OK\\n' + JSON.stringify(data, null, 2));
      } catch (err) {
        alert('❌ Erreur : ' + err.message);
      }
    }
  </script>
</body>
</html>
